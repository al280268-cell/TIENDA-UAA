<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Resultados Finales ÔÇö Reto E-Commerce UAA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <style>
    html, body { height:100%; }
    body { background:#07070F; color:white; overflow-x:hidden; }
    body::after {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.5;
      background-image: url('img/web.svg');
      background-repeat:repeat; background-size:80px;
    }

    /* Background */
    .bg-canvas { position:fixed; inset:0; z-index:0; pointer-events:none; }
    .bg-glow {
      position:absolute; width:700px; height:600px; border-radius:50%;
      background:radial-gradient(circle, rgba(196,18,48,0.14) 0%, transparent 70%);
      top:-200px; left:50%; transform:translateX(-50%);
      animation:glow-pulse 5s ease-in-out infinite;
    }
    .grid-overlay {
      position:absolute; inset:0;
      background-image:
        linear-gradient(rgba(196,18,48,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(196,18,48,0.03) 1px, transparent 1px);
      background-size:60px 60px;
    }
    @keyframes glow-pulse { 0%,100%{opacity:0.6;} 50%{opacity:1;} }

    .page { position:relative; z-index:1; min-height:100vh; padding:40px 20px 60px; }

    /* ÔöÇÔöÇ Loading overlay ÔöÇÔöÇ */
    .loading-overlay {
      position:fixed; inset:0; z-index:500;
      background:#04040A;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:24px;
      transition:opacity 0.6s ease;
    }
    .loading-overlay.fade-out { opacity:0; pointer-events:none; }
    .loading-icon { font-size:4rem; animation:spin-slow 2s linear infinite; }
    @keyframes spin-slow { to { transform:rotate(360deg); } }
    .loading-text {
      font-family:'Space Grotesk',sans-serif; font-size:1.4rem; font-weight:800;
      background:linear-gradient(135deg,#FF1744,#FF6B35,#FFD700);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .loading-dots span { animation:blink 1.2s infinite; display:inline-block; }
    .loading-dots span:nth-child(2) { animation-delay:0.2s; }
    .loading-dots span:nth-child(3) { animation-delay:0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:0;} 40%{opacity:1;} }
    .loading-bar-wrap { width:220px; height:4px; background:rgba(255,255,255,0.1); border-radius:99px; overflow:hidden; }
    .loading-bar-fill { height:100%; background:linear-gradient(90deg,#FF1744,#FFD700); border-radius:99px; width:0%; transition:width 2.8s ease-out; }

    /* ÔöÇÔöÇ Header ÔöÇÔöÇ */
    .header { display:flex; align-items:center; gap:12px; margin-bottom:36px; }
    .logo-mark {
      background:linear-gradient(135deg,#FF1744,#C41230); color:white;
      width:40px; height:40px; border-radius:10px;
      display:flex; align-items:center; justify-content:center;
      font-family:'Space Grotesk',sans-serif; font-weight:900; font-size:12px;
    }
    .header-text { font-family:'Space Grotesk',sans-serif; font-size:0.78rem; font-weight:700; color:rgba(255,255,255,0.35); text-transform:uppercase; letter-spacing:0.08em; }

    /* ÔöÇÔöÇ My result ÔöÇÔöÇ */
    .my-result { text-align:center; margin-bottom:36px; animation:slideUp 0.6s ease both; animation-delay:0.1s; }
    @keyframes slideUp { from{opacity:0;transform:translateY(30px);} to{opacity:1;transform:none;} }

    .rank-display {
      font-family:'Space Grotesk',sans-serif;
      font-size:clamp(5rem,22vw,10rem);
      font-weight:900; line-height:0.85;
      color:#C41230;
      text-shadow: 0 0 40px rgba(196,18,48,0.5), 0 0 80px rgba(196,18,48,0.2);
      margin-bottom:8px;
    }
    .rank-display.rank-1 { color:#FFD700; text-shadow:0 0 40px rgba(255,215,0,0.7),0 0 80px rgba(255,215,0,0.3); animation:glow-pulse 2s infinite; }
    .rank-display.rank-2 { color:#B0BEC5; text-shadow:0 0 30px rgba(176,190,197,0.5); }
    .rank-display.rank-3 { color:#C67C52; text-shadow:0 0 30px rgba(198,124,82,0.5); }

    .rank-label { font-family:'Space Grotesk',sans-serif; font-size:0.82rem; font-weight:700; color:rgba(255,255,255,0.3); letter-spacing:0.15em; text-transform:uppercase; margin-bottom:20px; }
    .my-avatar { width:84px; height:84px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:900; font-size:28px; color:white; margin:0 auto 12px; }
    .my-player-name { font-family:'Space Grotesk',sans-serif; font-size:1.7rem; font-weight:900; margin-bottom:4px; }
    .my-points { font-family:'Space Grotesk',sans-serif; font-size:2.8rem; font-weight:900; color:#ff8899; margin:8px 0 4px; }
    .points-label { font-size:0.75rem; color:rgba(255,255,255,0.3); letter-spacing:0.1em; text-transform:uppercase; }

    /* Stats */
    .stat-chips { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:16px; margin-bottom:8px; }
    .stat-chip { display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); padding:8px 16px; border-radius:99px; font-size:0.82rem; font-weight:600; color:rgba(255,255,255,0.65); }

    /* ÔöÇÔöÇ Result message boxes ÔöÇÔöÇ */
    .result-box {
      max-width:560px; margin:0 auto 28px;
      border-radius:20px; padding:24px; text-align:center;
      animation:slideUp 0.5s 0.3s ease both;
    }
    .result-box.winner {
      background:rgba(255,215,0,0.08);
      border:1.5px solid rgba(255,215,0,0.3);
    }
    .result-box.loser {
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
    }
    .result-box h3 { font-family:'Space Grotesk',sans-serif; font-size:1.2rem; font-weight:900; margin-bottom:8px; }
    .result-box p { font-size:0.88rem; color:rgba(255,255,255,0.5); margin-bottom:16px; line-height:1.5; }
    .btn-prize-access {
      display:inline-flex; align-items:center; gap:10px;
      background:linear-gradient(135deg,#FFD700,#FF6B35);
      color:#000; border:none; border-radius:14px;
      padding:16px 32px;
      font-family:'Space Grotesk',sans-serif; font-weight:900; font-size:1.05rem;
      cursor:pointer; text-decoration:none;
      box-shadow:0 8px 28px rgba(255,215,0,0.4);
      animation:glow-pulse 2s infinite;
      transition:all 0.2s;
    }
    .btn-prize-access:hover { transform:translateY(-3px); box-shadow:0 14px 36px rgba(255,215,0,0.6); }

    /* ÔöÇÔöÇ Leaderboard ÔöÇÔöÇ */
    .leaderboard-section {
      width:100%; max-width:560px; margin:0 auto 28px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.07);
      border-radius:20px; overflow:hidden;
      animation:slideUp 0.5s 0.35s ease both;
    }
    .lb-header { padding:18px 20px 0; font-family:'Space Grotesk',sans-serif; font-size:0.7rem; font-weight:700; color:rgba(255,255,255,0.3); letter-spacing:0.12em; text-transform:uppercase; margin-bottom:10px; }
    .lb-row { display:flex; align-items:center; gap:12px; padding:12px 20px; border-top:1px solid rgba(255,255,255,0.04); transition:background 0.15s; }
    .lb-row:hover { background:rgba(255,255,255,0.02); }
    .lb-row.is-me { background:rgba(196,18,48,0.1); border-top-color:rgba(196,18,48,0.15); }
    .lb-row.is-first { background:rgba(255,215,0,0.07); }
    .lb-pos { font-family:'Space Grotesk',sans-serif; font-weight:900; font-size:1.1rem; min-width:36px; text-align:center; }
    .lb-pos.gold { color:#FFD700; }
    .lb-pos.silver { color:#B0BEC5; }
    .lb-pos.bronze { color:#C67C52; }
    .lb-pos.other { color:rgba(255,255,255,0.25); font-size:0.9rem; }
    .lb-av { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:11px; color:white; flex-shrink:0; }
    .lb-name { flex:1; font-weight:600; font-size:0.9rem; }
    .lb-pts { font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:1rem; color:#ff8899; }

    /* ÔöÇÔöÇ Bottom buttons ÔöÇÔöÇ */
    .bottom-btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; max-width:560px; margin:0 auto; animation:slideUp 0.5s 0.4s ease both; }
    .btn-secondary-nav {
      display:inline-flex; align-items:center; gap:8px;
      background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12);
      color:rgba(255,255,255,0.65); padding:12px 22px; border-radius:12px;
      font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:0.875rem;
      cursor:pointer; text-decoration:none; transition:all 0.2s;
    }
    .btn-secondary-nav:hover { background:rgba(255,255,255,0.1); color:white; }

    /* Confetti */
    .confetti-piece { position:fixed; width:10px; height:10px; border-radius:2px; pointer-events:none; z-index:9999; animation:confetti-fall linear forwards; }
    @keyframes confetti-fall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1;} 100%{transform:translateY(110vh) rotate(720deg);opacity:0.3;} }
  </style>
</head>
<body>

<!-- Loading overlay -->
<div class="loading-overlay" id="loading-overlay">
  <div class="loading-icon">ÔÜí</div>
  <div class="loading-text">CALCULANDO RESULTADOS<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></div>
  <div class="loading-bar-wrap"><div class="loading-bar-fill" id="loading-bar"></div></div>
</div>

<div class="bg-canvas">
  <div class="bg-glow"></div>
  <div class="grid-overlay"></div>
</div>

<div class="page" id="main-page" style="opacity:0;">

  <div class="header">
    <div class="logo-mark">UAA</div>
    <span class="header-text">Reto E-Commerce ┬À Resultados Finales</span>
  </div>

  <!-- Mi resultado -->
  <div class="my-result">
    <div class="rank-label">Tu posici├│n final</div>
    <div class="rank-display" id="my-rank">ÔÇö</div>
    <div class="my-avatar" id="my-avatar">?</div>
    <div class="my-player-name" id="my-name">ÔÇö</div>
    <div class="my-points" id="my-points">0</div>
    <div class="points-label">puntos totales</div>
    <div class="stat-chips" id="stat-chips"></div>
  </div>

  <!-- Result message / prize access (populated by JS) -->
  <div id="result-message"></div>

  <!-- Leaderboard -->
  <div class="leaderboard-section">
    <div class="lb-header">Clasificaci├│n Final</div>
    <div id="leaderboard-list">
      <div style="text-align:center;padding:32px;color:rgba(255,255,255,0.25);">Cargando...</div>
    </div>
  </div>

  <div class="bottom-btns">
    <a href="hub.html" class="btn-secondary-nav">ÔåÉ Volver al Hub</a>
    <a href="index.html" class="btn-secondary-nav">Ôå® Inicio</a>
  </div>

</div>

<div id="toast-container"></div>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {

  // ÔöÇÔöÇ Loading animation ÔöÇÔöÇ
  const loadingOverlay = document.getElementById('loading-overlay');
  const loadingBar = document.getElementById('loading-bar');
  setTimeout(() => { loadingBar.style.width = '100%'; }, 80);
  setTimeout(() => {
    loadingOverlay.classList.add('fade-out');
    document.getElementById('main-page').style.opacity = '1';
    document.getElementById('main-page').style.transition = 'opacity 0.5s ease';
  }, 3000);

  // ÔöÇÔöÇ Session data ÔöÇÔöÇ
  const raw        = sessionStorage.getItem('uaa_game_results');
  const results    = raw ? JSON.parse(raw) : null;
  const myId       = App.Session.get('uaa_player_id');
  const myName     = App.Session.get('uaa_player_name') || 'Jugador';
  const myColor    = App.Session.get('uaa_avatar_color') || '#C41230';
  const myInitials = App.Session.get('uaa_avatar_initials') || myName.slice(0,2).toUpperCase();
  const gameCode   = App.Session.get('uaa_game_code');

  // Avatar
  const avatarEl = document.getElementById('my-avatar');
  avatarEl.textContent = myInitials;
  avatarEl.style.background = myColor;
  avatarEl.style.boxShadow = `0 0 0 4px rgba(255,255,255,0.08), 0 0 28px ${myColor}88`;
  document.getElementById('my-name').textContent = myName;

  // Leaderboard
  let players = [];
  if (gameCode) {
    const { data } = await App.Api.get(`/api/scoring/leaderboard/${gameCode}`);
    if (data) players = data;
  }
  if (!players.length && results?.leaderboard) players = results.leaderboard;

  // My rank & points
  const me = players.find(p => p.player_id === myId || p.id === myId);
  const myRank   = me?.rank || results?.my_rank || '?';
  const myPoints = me?.points || results?.my_points || parseInt(App.Session.get('uaa_my_points') || '0');

  // Save rank for prize.html access gate
  sessionStorage.setItem('uaa_my_rank', String(myRank));

  // Rank display
  const rankEl = document.getElementById('my-rank');
  if (myRank === 1)      { rankEl.textContent = '­ƒÑç'; rankEl.classList.add('rank-1'); }
  else if (myRank === 2) { rankEl.textContent = '­ƒÑê'; rankEl.classList.add('rank-2'); }
  else if (myRank === 3) { rankEl.textContent = '­ƒÑë'; rankEl.classList.add('rank-3'); }
  else                   { rankEl.textContent = '#' + myRank; }

  document.getElementById('my-points').textContent = App.formatPoints(myPoints);

  // Stat chips
  const streak   = me?.max_streak || me?.streak || results?.max_streak || 0;
  const missions = me?.missions_completed || results?.missions_completed || 0;
  const accuracy = missions ? Math.round((results?.correct_answers || missions) / missions * 100) : 0;
  const chips = document.getElementById('stat-chips');
  chips.innerHTML = [
    streak >= 2    ? `<div class="stat-chip">­ƒöÑ Racha m├íx: ├ù${streak}</div>` : '',
    missions       ? `<div class="stat-chip">Ô£à Misiones: ${missions}</div>` : '',
    accuracy       ? `<div class="stat-chip">­ƒÄ» Precisi├│n: ${accuracy}%</div>` : '',
    myRank === 1   ? `<div class="stat-chip">­ƒÅå ┬íCampe├│n!</div>` : '',
  ].join('');

  // ÔöÇÔöÇ Result message ÔöÇÔöÇ
  const msgEl = document.getElementById('result-message');
  if (myRank === 1) {
    msgEl.innerHTML = `
      <div class="result-box winner">
        <h3>­ƒÅå ┬íGANASTE LA PARTIDA!</h3>
        <p>Has obtenido el primer lugar entre todos los competidores. Solo t├║ tienes derecho a elegir un premio.</p>
        <a href="prize.html" class="btn-prize-access">­ƒÄü ENTRAR A LA TIENDA DE PREMIOS</a>
      </div>`;
    launchConfetti(['#FFD700','#FF6B35','#FF1744','#fff','#FFD700','#FFA000']);
  } else if (myRank === 2) {
    msgEl.innerHTML = `
      <div class="result-box loser">
        <h3>­ƒÑê ┬íSegundo lugar!</h3>
        <p>Estuviste muy cerca. Solo el primer lugar puede reclamar el premio. ┬íSigue intentando!</p>
      </div>`;
    launchConfetti(['#B0BEC5','#CFD8DC','#90A4AE','#fff']);
  } else if (myRank === 3) {
    msgEl.innerHTML = `
      <div class="result-box loser">
        <h3>­ƒÑë Tercer lugar</h3>
        <p>Buen desempe├▒o, pero el premio exclusivo es solo para el campe├│n de la partida.</p>
      </div>`;
  } else {
    msgEl.innerHTML = `
      <div class="result-box loser">
        <h3>Ronda terminada</h3>
        <p>Tu puntuaci├│n no fue suficiente para ganar el primer lugar esta vez. El premio es exclusivo para el 1er lugar.</p>
      </div>`;
  }

  // ÔöÇÔöÇ Leaderboard list ÔöÇÔöÇ
  const list = document.getElementById('leaderboard-list');
  if (players.length) {
    list.innerHTML = players.map((p, i) => {
      const rank     = i + 1;
      const isMe     = p.player_id === myId || p.id === myId;
      const isFirst  = rank === 1;
      const posClass = rank===1?'gold':rank===2?'silver':rank===3?'bronze':'other';
      const medal    = rank===1?'­ƒÑç':rank===2?'­ƒÑê':rank===3?'­ƒÑë':rank;
      const color    = p.avatar_color || p.color || '#C41230';
      const initials = p.avatar_initials || p.initials || (p.name||'??').slice(0,2).toUpperCase();
      return `
        <div class="lb-row${isMe?' is-me':''}${isFirst?' is-first':''}">
          <div class="lb-pos ${posClass}">${medal}</div>
          <div class="lb-av" style="background:${color};box-shadow:0 0 10px ${color}66">${initials}</div>
          <div class="lb-name">${p.name||'Jugador'}${isMe?` <span style="color:#ff8899;font-size:0.75rem;">(T├║)</span>`:''}</div>
          <div class="lb-pts">${App.formatPoints(p.points||0)}</div>
        </div>`;
    }).join('');
  } else {
    list.innerHTML = '<div style="text-align:center;padding:32px;color:rgba(255,255,255,0.25);">Sin datos de clasificaci├│n</div>';
  }

  function launchConfetti(colors) {
    for (let i = 0; i < 90; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left     = Math.random() * 100 + 'vw';
        el.style.top      = '-20px';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.width    = (7 + Math.random() * 9) + 'px';
        el.style.height   = (7 + Math.random() * 9) + 'px';
        el.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
        el.style.animationDelay   = (Math.random() * 0.8) + 's';
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 6000);
      }, i * 35);
    }
  }
});
</script>
</body>
</html>
